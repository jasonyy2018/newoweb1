events {
    worker_connections 1024;
}

http {
    upstream wisdomitc_next {
        server next-web:3000;
    }

    # ... existing mime and log configs ...

    server {
        listen 80;
        server_name localhost wisdomitc.com www.wisdomitc.com 156.238.249.149;

        # Next.js standalone handles static files, but we can still proxy them
        location / {
            proxy_pass http://wisdomitc_next;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check
        location /api/health {
            proxy_pass http://wisdomitc_next;
        }
        
        # 错误页面
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }
    }
    
    # HTTPS服务器配置示例（如果需要SSL）
