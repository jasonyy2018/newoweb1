version: '3.8'

services:
  next-web:
    build:
      context: ./next-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://aiow:EZH3HPYzy3QNGTEz@156.238.249.149:5432/aiow?schema=public
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=wisdomitc2025
      - SECRET_KEY=dev-secret-key-change-in-production
    restart: unless-stopped
    networks:
      - wisdomitc-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
      - "8091:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - next-web
    restart: unless-stopped
    networks:
      - wisdomitc-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 移除了redis服务定义，因为我们现在使用外部Redis

volumes:
  # 使用Docker命名卷
  consultations-data:
  logs-data:


networks:
  wisdomitc-network:
    driver: bridge
