version: '3.8'

services:
  web:
    build: .
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      # 添加Redis连接信息
      - REDIS_URL=redis://redis_C7DGKB@156.238.249.149:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - wisdomitc-network
    # 移除了depends_on中的redis，因为我们现在使用外部Redis
    command: gunicorn --bind 0.0.0.0:5001 --workers 3 --chdir /app app:app
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - wisdomitc-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# 移除了redis服务定义，因为我们现在使用外部Redis

volumes:
  # 移除了redis-data卷，因为我们现在使用外部Redis
  consultations-data:

networks:
  wisdomitc-network:
    driver: bridge