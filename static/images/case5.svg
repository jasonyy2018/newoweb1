<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logisticsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc107;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffc107;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#logisticsGradient)"/>
  
  <!-- 仓库 -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="80" height="60" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <rect x="10" y="10" width="60" height="15" fill="#ffc107"/>
    <text x="40" y="22" text-anchor="middle" font-size="10" fill="white" font-weight="bold">仓库A</text>
  </g>
  
  <g transform="translate(270, 150)">
    <rect x="0" y="0" width="80" height="60" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <rect x="10" y="10" width="60" height="15" fill="#ffc107"/>
    <text x="40" y="22" text-anchor="middle" font-size="10" fill="white" font-weight="bold">仓库B</text>
  </g>
  
  <!-- 配送车辆 -->
  <g transform="translate(180, 120)">
    <rect x="0" y="0" width="40" height="20" fill="#6c757d" rx="4"/>
    <circle cx="8" cy="25" r="6" fill="#1D2129"/>
    <circle cx="32" cy="25" r="6" fill="#1D2129"/>
    <rect x="5" y="5" width="30" height="10" fill="#ffc107"/>
  </g>
  
  <!-- 路径优化线 -->
  <g opacity="0.7">
    <path d="M90 180 Q200 100 270 180" stroke="#ffc107" stroke-width="3" fill="none" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- AI优化系统 -->
  <g transform="translate(200, 60)">
    <circle cx="0" cy="0" r="25" fill="#ffc107" opacity="0.8"/>
    <path d="M-10,-5 L0,5 L10,-5" stroke="white" stroke-width="3" fill="none"/>
    <text x="0" y="40" text-anchor="middle" font-size="12" fill="#ffc107">路径优化</text>
  </g>
  
  <!-- 效率提升指标 -->
  <g transform="translate(300, 50)">
    <rect x="0" y="0" width="90" height="60" fill="white" stroke="#dee2e6" rx="8"/>
    <text x="45" y="25" text-anchor="middle" font-size="16" fill="#ffc107" font-weight="bold">+30%</text>
    <text x="45" y="40" text-anchor="middle" font-size="10" fill="#6c757d">配送效率</text>
  </g>
  
  <!-- 成本节约指标 -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="90" height="60" fill="white" stroke="#dee2e6" rx="8"/>
    <text x="45" y="25" text-anchor="middle" font-size="16" fill="#36D399" font-weight="bold">-25%</text>
    <text x="45" y="40" text-anchor="middle" font-size="10" fill="#6c757d">运输成本</text>
  </g>
</svg>