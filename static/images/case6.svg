<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="educationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0d6efd;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#educationGradient)"/>
  
  <!-- 在线学习平台 -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="120" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
    <rect x="20" y="20" width="160" height="20" fill="#0d6efd"/>
    <text x="100" y="35" text-anchor="middle" font-size="12" fill="white" font-weight="bold">智能学习平台</text>
    
    <!-- 课程模块 -->
    <rect x="30" y="60" width="40" height="30" fill="#e9ecef" stroke="#adb5bd" rx="4"/>
    <rect x="80" y="60" width="40" height="30" fill="#e9ecef" stroke="#adb5bd" rx="4"/>
    <rect x="130" y="60" width="40" height="30" fill="#e9ecef" stroke="#adb5bd" rx="4"/>
    
    <!-- 进度条 -->
    <rect x="30" y="110" width="140" height="8" fill="#e9ecef" rx="4"/>
    <rect x="30" y="110" width="84" height="8" fill="#0d6efd" rx="4"/>
  </g>
  
  <!-- AI推荐引擎 -->
  <g transform="translate(50, 60)">
    <circle cx="0" cy="0" r="25" fill="#0d6efd" opacity="0.8"/>
    <rect x="-8" y="-8" width="16" height="16" fill="white" rx="2"/>
    <circle cx="0" cy="0" r="4" fill="#0d6efd"/>
    <text x="0" y="40" text-anchor="middle" font-size="12" fill="#0d6efd">AI推荐</text>
  </g>
  
  <!-- 个性化路径 -->
  <g opacity="0.6">
    <path d="M75 85 Q150 70 200 100" stroke="#0d6efd" stroke-width="2" fill="none" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 学习效果提升 -->
  <g transform="translate(320, 120)">
    <rect x="0" y="0" width="70" height="80" fill="white" stroke="#dee2e6" rx="8"/>
    <circle cx="35" cy="30" r="18" fill="#0d6efd" opacity="0.2"/>
    <text x="35" y="38" text-anchor="middle" font-size="16" fill="#0d6efd" font-weight="bold">50%</text>
    <text x="35" y="55" text-anchor="middle" font-size="9" fill="#6c757d">学习效果</text>
    <text x="35" y="68" text-anchor="middle" font-size="9" fill="#6c757d">提升</text>
  </g>
  
  <!-- 书本图标 -->
  <g transform="translate(350, 60)" opacity="0.4">
    <rect x="0" y="0" width="12" height="16" fill="#0d6efd" rx="2"/>
    <rect x="2" y="2" width="8" height="12" fill="white"/>
    <line x1="4" y1="5" x2="8" y2="5" stroke="#0d6efd" stroke-width="1"/>
    <line x1="4" y1="8" x2="8" y2="8" stroke="#0d6efd" stroke-width="1"/>
  </g>
</svg>