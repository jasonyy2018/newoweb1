<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="medicalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc3545;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#dc3545;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#medicalGradient)"/>
  
  <!-- 医院建筑 -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="240" height="120" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <rect x="20" y="20" width="200" height="25" fill="#dc3545"/>
    <text x="120" y="38" text-anchor="middle" font-size="14" fill="white" font-weight="bold">智慧医疗</text>
    
    <!-- 医疗设备 -->
    <rect x="40" y="60" width="60" height="40" fill="#e9ecef" stroke="#adb5bd"/>
    <rect x="140" y="60" width="60" height="40" fill="#e9ecef" stroke="#adb5bd"/>
    
    <!-- 显示屏 -->
    <rect x="45" y="65" width="50" height="30" fill="#1D2129"/>
    <rect x="145" y="65" width="50" height="30" fill="#1D2129"/>
  </g>
  
  <!-- AI分析系统 -->
  <g transform="translate(320, 60)">
    <circle cx="0" cy="0" r="25" fill="#dc3545" opacity="0.8"/>
    <path d="M-8,-8 L8,8 M8,-8 L-8,8" stroke="white" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="white" stroke-width="2"/>
    <text x="0" y="40" text-anchor="middle" font-size="12" fill="#dc3545">AI诊断</text>
  </g>
  
  <!-- 数据传输 -->
  <g opacity="0.6">
    <path d="M200 180 Q260 140 320 85" stroke="#dc3545" stroke-width="2" fill="none" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 准确率指标 -->
  <g transform="translate(20, 200)">
    <rect x="0" y="0" width="100" height="80" fill="white" stroke="#dee2e6" rx="8"/>
    <circle cx="50" cy="30" r="20" fill="#dc3545" opacity="0.2"/>
    <text x="50" y="38" text-anchor="middle" font-size="18" fill="#dc3545" font-weight="bold">98%</text>
    <text x="50" y="55" text-anchor="middle" font-size="10" fill="#6c757d">识别准确率</text>
  </g>
  
  <!-- 医疗图标 -->
  <g transform="translate(50, 50)" opacity="0.4">
    <circle cx="0" cy="0" r="15" fill="#dc3545"/>
    <rect x="-8" y="-2" width="16" height="4" fill="white"/>
    <rect x="-2" y="-8" width="4" height="16" fill="white"/>
  </g>
</svg>