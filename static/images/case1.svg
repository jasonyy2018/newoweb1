<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="financeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff5e6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bankGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7D00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9A33;stop-opacity:1" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#financeGradient)"/>
  
  <!-- 装饰性网格 -->
  <g stroke="#FF7D00" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
  </g>
  
  <!-- 现代银行建筑 -->
  <g transform="translate(40, 60)">
    <!-- 主建筑 -->
    <rect x="0" y="0" width="200" height="140" rx="8" fill="white" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="200" height="30" rx="8" fill="url(#bankGradient)"/>
    
    <!-- 现代立柱 -->
    <g fill="#e9ecef">
      <rect x="20" y="35" width="8" height="95" rx="4"/>
      <rect x="40" y="35" width="8" height="95" rx="4"/>
      <rect x="60" y="35" width="8" height="95" rx="4"/>
      <rect x="80" y="35" width="8" height="95" rx="4"/>
      <rect x="100" y="35" width="8" height="95" rx="4"/>
      <rect x="120" y="35" width="8" height="95" rx="4"/>
      <rect x="140" y="35" width="8" height="95" rx="4"/>
      <rect x="160" y="35" width="8" height="95" rx="4"/>
      <rect x="172" y="35" width="8" height="95" rx="4"/>
    </g>
    
    <!-- 现代入口 -->
    <rect x="75" y="100" width="50" height="40" rx="4" fill="#495057"/>
    <rect x="80" y="105" width="40" height="30" rx="2" fill="#6c757d"/>
    
    <!-- 银行标识 -->
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">智慧银行</text>
  </g>
  
  <!-- AI处理中心 -->
  <g transform="translate(280, 40)">
    <!-- AI芯片 -->
    <rect x="0" y="0" width="80" height="80" rx="12" fill="white" filter="url(#cardShadow)"/>
    <rect x="8" y="8" width="64" height="64" rx="8" fill="url(#bankGradient)"/>
    
    <!-- 芯片电路 -->
    <g stroke="white" stroke-width="2" opacity="0.9">
      <circle cx="24" cy="24" r="4" fill="white"/>
      <circle cx="56" cy="24" r="4" fill="white"/>
      <circle cx="24" cy="56" r="4" fill="white"/>
      <circle cx="56" cy="56" r="4" fill="white"/>
      <circle cx="40" cy="40" r="6" fill="white"/>
      
      <line x1="24" y1="40" x2="34" y2="40"/>
      <line x1="46" y1="40" x2="56" y2="40"/>
      <line x1="40" y1="24" x2="40" y2="34"/>
      <line x1="40" y1="46" x2="40" y2="56"/>
    </g>
    
    <!-- 处理指示器 -->
    <circle cx="40" cy="40" r="15" fill="none" stroke="white" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="15;25;15" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <text x="40" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FF7D00">AI风控引擎</text>
  </g>
  
  <!-- 数据流动 -->
  <g>
    <!-- 数据传输线 -->
    <path d="M240 120 Q260 100 280 120" stroke="#FF7D00" stroke-width="3" fill="none" opacity="0.7">
      <animate attributeName="stroke-dasharray" values="0,20;10,10;20,0" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- 数据粒子 -->
    <circle r="3" fill="#FF7D00" opacity="0.8">
      <animateMotion dur="2s" repeatCount="indefinite">
        <path d="M240,120 Q260,100 280,120"/>
      </animateMotion>
    </circle>
  </g>
  
  <!-- 审批效率统计 -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="white" filter="url(#cardShadow)"/>
    
    <!-- 图表标题 -->
    <text x="75" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#495057">审批效率提升</text>
    
    <!-- 柱状图 -->
    <g transform="translate(20, 25)">
      <rect x="0" y="20" width="12" height="8" fill="#dee2e6"/>
      <rect x="18" y="15" width="12" height="13" fill="#FF7D00"/>
      <rect x="36" y="10" width="12" height="18" fill="#36D399"/>
      <rect x="54" y="5" width="12" height="23" fill="#8B5CF6"/>
      <rect x="72" y="0" width="12" height="28" fill="#FF7D00"/>
      <rect x="90" y="0" width="12" height="28" fill="#36D399"/>
      
      <!-- 百分比标识 -->
      <text x="110" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF7D00">85%</text>
    </g>
    
    <text x="75" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6c757d">自动化处理率</text>
  </g>
  
  <!-- 业务流程卡片 -->
  <g transform="translate(220, 200)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="white" filter="url(#cardShadow)"/>
    
    <!-- 流程步骤 -->
    <g transform="translate(20, 20)">
      <!-- 申请 -->
      <circle cx="0" cy="0" r="8" fill="#e9ecef"/>
      <text x="0" y="4" text-anchor="middle" font-size="8" fill="#495057">申</text>
      
      <!-- 箭头 -->
      <path d="M10 0 L20 0 M17 -3 L20 0 L17 3" stroke="#6c757d" stroke-width="1" fill="none"/>
      
      <!-- AI处理 -->
      <circle cx="30" cy="0" r="8" fill="#FF7D00"/>
      <text x="30" y="4" text-anchor="middle" font-size="8" fill="white">AI</text>
      
      <!-- 箭头 -->
      <path d="M40 0 L50 0 M47 -3 L50 0 L47 3" stroke="#6c757d" stroke-width="1" fill="none"/>
      
      <!-- 审批 -->
      <circle cx="60" cy="0" r="8" fill="#36D399"/>
      <text x="60" y="4" text-anchor="middle" font-size="8" fill="white">批</text>
      
      <!-- 箭头 -->
      <path d="M70 0 L80 0 M77 -3 L80 0 L77 3" stroke="#6c757d" stroke-width="1" fill="none"/>
      
      <!-- 放款 -->
      <circle cx="90" cy="0" r="8" fill="#8B5CF6"/>
      <text x="90" y="4" text-anchor="middle" font-size="8" fill="white">放</text>
    </g>
    
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#495057">智能审批流程</text>
    <text x="70" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6c757d">平均处理时间: 2小时</text>
    <text x="70" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#36D399">原处理时间: 2-3天</text>
  </g>
  
  <!-- 装饰性金融元素 -->
  <g opacity="0.2">
    <circle cx="30" cy="30" r="10" fill="#FFC107"/>
    <text x="30" y="35" text-anchor="middle" font-size="10" fill="white">¥</text>
    
    <circle cx="370" cy="270" r="8" fill="#36D399"/>
    <text x="370" y="275" text-anchor="middle" font-size="8" fill="white">$</text>
  </g>
</svg>