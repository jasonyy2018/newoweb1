<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="retailGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fffe;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0fdf4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#36D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4FFFB3;stop-opacity:1" />
    </linearGradient>
    <filter id="retailShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#retailGradient)"/>
  
  <!-- 装饰性网格 -->
  <g stroke="#36D399" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
  </g>
  
  <!-- 现代超市建筑 -->
  <g transform="translate(30, 80)">
    <!-- 主建筑 -->
    <rect x="0" y="0" width="180" height="120" rx="8" fill="white" filter="url(#retailShadow)"/>
    <rect x="0" y="0" width="180" height="25" rx="8" fill="url(#shopGradient)"/>
    
    <!-- 窗户 -->
    <g fill="#e3f2fd">
      <rect x="20" y="35" width="30" height="25" rx="3" stroke="#36D399" stroke-width="1"/>
      <rect x="60" y="35" width="30" height="25" rx="3" stroke="#36D399" stroke-width="1"/>
      <rect x="100" y="35" width="30" height="25" rx="3" stroke="#36D399" stroke-width="1"/>
      <rect x="140" y="35" width="30" height="25" rx="3" stroke="#36D399" stroke-width="1"/>
    </g>
    
    <!-- 入口门 -->
    <rect x="70" y="85" width="40" height="35" rx="4" fill="#455a64"/>
    <rect x="75" y="90" width="30" height="25" rx="2" fill="#607d8b"/>
    
    <!-- 店铺标识 -->
    <text x="90" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">智能超市</text>
    
    <!-- 货架的简化表示 -->
    <g transform="translate(25, 70)" fill="#f5f5f5" stroke="#36D399" stroke-width="1">
      <rect x="0" y="0" width="8" height="15" rx="1"/>
      <rect x="12" y="0" width="8" height="15" rx="1"/>
      <rect x="24" y="0" width="8" height="15" rx="1"/>
      <rect x="50" y="0" width="8" height="15" rx="1"/>
      <rect x="62" y="0" width="8" height="15" rx="1"/>
      <rect x="74" y="0" width="8" height="15" rx="1"/>
      <rect x="100" y="0" width="8" height="15" rx="1"/>
      <rect x="112" y="0" width="8" height="15" rx="1"/>
      <rect x="124" y="0" width="8" height="15" rx="1"/>
    </g>
  </g>
  
  <!-- AI预测中心 -->
  <g transform="translate(280, 40)">
    <!-- AI大脑 -->
    <rect x="0" y="0" width="80" height="80" rx="12" fill="white" filter="url(#retailShadow)"/>
    <rect x="8" y="8" width="64" height="64" rx="8" fill="url(#shopGradient)"/>
    
    <!-- 预测图标 -->
    <g transform="translate(40, 40)">
      <!-- 数据点 -->
      <g fill="white" opacity="0.9">
        <circle cx="-20" cy="10" r="2"/>
        <circle cx="-10" cy="5" r="2"/>
        <circle cx="0" cy="-5" r="2"/>
        <circle cx="10" cy="-10" r="2"/>
        <circle cx="20" cy="-15" r="2"/>
      </g>
      
      <!-- 预测曲线 -->
      <path d="M-20,10 Q-10,5 0,-5 Q10,-10 20,-15" stroke="white" stroke-width="2" fill="none" opacity="0.8"/>
      
      <!-- 预测区域 -->
      <path d="M20,-15 Q25,-18 30,-20" stroke="white" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="3,3"/>
      <circle cx="30" cy="-20" r="3" fill="white" opacity="0.6">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <text x="40" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#36D399">需求预测</text>
  </g>
  
  <!-- 数据流动 -->
  <g>
    <!-- 数据传输线 -->
    <path d="M210 140 Q240 120 280 140" stroke="#36D399" stroke-width="3" fill="none" opacity="0.7">
      <animate attributeName="stroke-dasharray" values="0,20;10,10;20,0" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- 数据粒子 -->
    <circle r="3" fill="#36D399" opacity="0.8">
      <animateMotion dur="2s" repeatCount="indefinite">
        <path d="M210,140 Q240,120 280,140"/>
      </animateMotion>
    </circle>
  </g>
  
  <!-- 库存优化统计 -->
  <g transform="translate(30, 220)">
    <rect x="0" y="0" width="160" height="60" rx="8" fill="white" filter="url(#retailShadow)"/>
    
    <!-- 标题 -->
    <text x="80" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#495057">库存准确率提升</text>
    
    <!-- 进度条 -->
    <g transform="translate(20, 25)">
      <!-- 背景条 -->
      <rect x="0" y="0" width="120" height="8" rx="4" fill="#e9ecef"/>
      <!-- 进度条 -->
      <rect x="0" y="0" width="48" height="8" rx="4" fill="url(#shopGradient)">
        <animate attributeName="width" values="0;48;48" dur="3s" begin="0s" fill="freeze"/>
      </rect>
      <!-- 百分比 -->
      <text x="60" y="6" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#36D399">40%</text>
      <text x="85" y="6" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">提升</text>
    </g>
    
    <text x="80" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6c757d">智能预测算法效果</text>
  </g>
  
  <!-- 销售预测图表 -->
  <g transform="translate(220, 180)">
    <rect x="0" y="0" width="140" height="100" rx="8" fill="white" filter="url(#retailShadow)"/>
    
    <!-- 标题 -->
    <text x="70" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#495057">未来销售预测</text>
    
    <!-- 预测图表 -->
    <g transform="translate(20, 25)">
      <!-- 坐标轴 -->
      <line x1="0" y1="50" x2="100" y2="50" stroke="#dee2e6" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="50" stroke="#dee2e6" stroke-width="1"/>
      
      <!-- 历史数据 -->
      <g fill="#36D399" opacity="0.7">
        <rect x="5" y="40" width="6" height="10"/>
        <rect x="15" y="35" width="6" height="15"/>
        <rect x="25" y="30" width="6" height="20"/>
        <rect x="35" y="25" width="6" height="25"/>
        <rect x="45" y="20" width="6" height="30"/>
      </g>
      
      <!-- 预测数据 -->
      <g fill="#FF7D00" opacity="0.8">
        <rect x="60" y="15" width="6" height="35" stroke="#FF7D00" stroke-width="1" stroke-dasharray="2,2"/>
        <rect x="70" y="10" width="6" height="40" stroke="#FF7D00" stroke-width="1" stroke-dasharray="2,2"/>
        <rect x="80" y="5" width="6" height="45" stroke="#FF7D00" stroke-width="1" stroke-dasharray="2,2"/>
        <rect x="90" y="8" width="6" height="42" stroke="#FF7D00" stroke-width="1" stroke-dasharray="2,2"/>
      </g>
      
      <!-- 分界线 -->
      <line x1="55" y1="0" x2="55" y2="50" stroke="#6c757d" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
      <text x="27" y="65" text-anchor="middle" font-size="8" fill="#36D399">历史</text>
      <text x="77" y="65" text-anchor="middle" font-size="8" fill="#FF7D00">预测</text>
    </g>
  </g>
  
  <!-- 装饰性元素 -->
  <g opacity="0.2">
    <!-- 购物车 -->
    <g transform="translate(20, 30)">
      <rect x="0" y="0" width="12" height="8" rx="2" fill="#36D399"/>
      <circle cx="3" cy="12" r="2" fill="#36D399"/>
      <circle cx="9" cy="12" r="2" fill="#36D399"/>
    </g>
    
    <!-- 价签 -->
    <g transform="translate(350, 250)">
      <rect x="0" y="0" width="20" height="12" rx="2" fill="#FF7D00"/>
      <circle cx="0" cy="6" r="3" fill="white"/>
      <text x="10" y="8" text-anchor="middle" font-size="8" fill="white">价</text>
    </g>
  </g>
</svg>