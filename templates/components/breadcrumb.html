<!-- Breadcrumb Navigation -->
<nav class="mb-6 text-sm">
    <ol class="list-none p-0 inline-flex">
        <li class="flex items-center">
            <a href="/" class="text-primary hover:underline">{{ _('首页') }}</a>
            <svg class="w-4 h-4 mx-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
        </li>
        {% if breadcrumb %}
            {% for item in breadcrumb %}
            <li class="flex items-center">
                {% if not loop.last %}
                <a href="{{ item.url }}" class="text-primary hover:underline">{{ item.name }}</a>
                <svg class="w-4 h-4 mx-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
                {% else %}
                <span class="text-gray-500">{{ item.name }}</span>
                {% endif %}
            </li>
            {% endfor %}
        {% else %}
        <li class="flex items-center">
            <span class="text-gray-500">{{ _('当前页面') }}</span>
        </li>
        {% endif %}
    </ol>
</nav>
