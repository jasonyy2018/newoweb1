<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('联系我们') }} - {{ _('上海葳澄信息科技') }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="font-sans text-dark bg-light">
        <!-- Navigation bar (same as in index.html) -->
    
    <main class="container mx-auto px-4 py-20">
        <h1 class="text-4xl font-bold text-primary mb-8">{{ _('联系我们') }}</h1>
        
        <div class="grid md:grid-cols-2 gap-8">
            <section>
                <h2 class="text-2xl font-semibold mb-4">{{ _('联系方式') }}</h2>
                    <!-- Contact information -->
            </section>
            
            <section>
                <h2 class="text-2xl font-semibold mb-4">{{ _('留言板') }}</h2>
                <form method="POST" class="space-y-4">
                    <div>
                        <label class="block mb-1">{{ _('姓名') }}</label>
                        <input type="text" name="name" class="w-full px-4 py-2 border rounded">
                    </div>
                    <div>
                        <label class="block mb-1">{{ _('邮箱') }}</label>
                        <input type="email" name="email" class="w-full px-4 py-2 border rounded">
                    </div>
                    <div>
                        <label class="block mb-1">{{ _('留言内容') }}</label>
                        <textarea name="message" rows="4" class="w-full px-4 py-2 border rounded"></textarea>
                    </div>
                    <button type="submit" class="bg-primary text-white px-6 py-2 rounded hover:bg-secondary transition">
                        {{ _('提交') }}
                    </button>
                </form>
            </section>
        </div>
    </main>
    
        <!-- Footer (same as in index.html) -->
</body>
</html>
